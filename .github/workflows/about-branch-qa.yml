name: About branch QA

on:
  push:
    branches:
      - agent/about-premium-motion-polish-v1
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  about-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start local server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/about-server.log 2>&1 &
          echo $! > /tmp/about-server.pid
          sleep 2

      - name: Run About QA
        run: |
          cat > /tmp/about-qa.mjs <<'EOF'
          import { chromium } from 'playwright';
          import fs from 'node:fs';
          import path from 'node:path';

          const outputDir = path.resolve('about-qa-artifacts');
          const screenshotDir = path.join(outputDir, 'screenshots');
          fs.mkdirSync(screenshotDir, { recursive: true });

          const baseURL = 'http://127.0.0.1:4173';
          const pages = [
            { lang: 'EN', path: '/about/' },
            { lang: 'RU', path: '/ru/about/' }
          ];
          const viewports = [
            { name: '1440x1000', width: 1440, height: 1000, kind: 'desktop' },
            { name: '1280x900', width: 1280, height: 900, kind: 'desktop' },
            { name: '1024x768', width: 1024, height: 768, kind: 'tablet' },
            { name: '768x1024', width: 768, height: 1024, kind: 'tablet' },
            { name: '430x932', width: 430, height: 932, kind: 'mobile' },
            { name: '390x844', width: 390, height: 844, kind: 'mobile' },
            { name: '375x812', width: 375, height: 812, kind: 'mobile' },
            { name: '360x800', width: 360, height: 800, kind: 'mobile' },
            { name: '320x720', width: 320, height: 720, kind: 'mobile' },
            { name: '844x390', width: 844, height: 390, kind: 'landscape' },
            { name: '932x430', width: 932, height: 430, kind: 'landscape' }
          ];

          const browser = await chromium.launch({ headless: true });
          const report = {
            generatedAt: new Date().toISOString(),
            source: process.env.GITHUB_SHA || null,
            matrix: [],
            screenshots: [],
            globalConsoleErrors: [],
            globalPageErrors: [],
            globalFailedFirstPartyRequests: [],
            assetAudit: {},
            focusedChecks: {}
          };

          function attachDiagnostics(page, bucket) {
            page.on('console', (msg) => {
              if (msg.type() === 'error') bucket.consoleErrors.push(msg.text());
            });
            page.on('pageerror', (error) => bucket.pageErrors.push(String(error)));
            page.on('requestfailed', (request) => {
              const url = request.url();
              if (url.startsWith(baseURL)) {
                bucket.failedFirstPartyRequests.push({ url, error: request.failure()?.errorText || 'unknown' });
              }
            });
          }

          async function addPerformanceInit(page) {
            await page.addInitScript(() => {
              window.__aboutQA = { layoutShift: 0, longTasks: [] };
              try {
                new PerformanceObserver((list) => {
                  for (const entry of list.getEntries()) {
                    if (!entry.hadRecentInput) window.__aboutQA.layoutShift += entry.value;
                  }
                }).observe({ type: 'layout-shift', buffered: true });
              } catch {}
              try {
                new PerformanceObserver((list) => {
                  for (const entry of list.getEntries()) {
                    window.__aboutQA.longTasks.push(Math.round(entry.duration));
                  }
                }).observe({ type: 'longtask', buffered: true });
              } catch {}
            });
          }

          async function revealAll(page) {
            await page.evaluate(async () => {
              const step = Math.max(280, Math.floor(window.innerHeight * 0.72));
              for (let y = 0; y < document.documentElement.scrollHeight; y += step) {
                window.scrollTo(0, y);
                await new Promise((resolve) => setTimeout(resolve, 70));
              }
              window.scrollTo(0, document.documentElement.scrollHeight);
            });
            await page.waitForTimeout(800);
          }

          async function inspectPage(page, lang, viewport) {
            return page.evaluate(({ lang, viewport }) => {
              const allIds = Array.from(document.querySelectorAll('[id]')).map((el) => el.id);
              const duplicateIds = allIds.filter((id, index) => allIds.indexOf(id) !== index);
              const root = document.documentElement;
              const body = document.body;
              const overflowCandidates = [];
              const ignoredTags = new Set(['SCRIPT', 'STYLE', 'META', 'LINK', 'PATH', 'DEFS', 'CLIPPATH']);
              for (const el of document.querySelectorAll('body *')) {
                if (ignoredTags.has(el.tagName)) continue;
                const style = getComputedStyle(el);
                if (style.display === 'none' || style.visibility === 'hidden' || style.position === 'fixed') continue;
                const rect = el.getBoundingClientRect();
                if (rect.width < 1 || rect.height < 1) continue;
                if (rect.left < -1 || rect.right > window.innerWidth + 1) {
                  overflowCandidates.push({
                    tag: el.tagName.toLowerCase(),
                    cls: String(el.className || '').slice(0, 140),
                    left: Math.round(rect.left * 10) / 10,
                    right: Math.round(rect.right * 10) / 10,
                    width: Math.round(rect.width * 10) / 10
                  });
                  if (overflowCandidates.length >= 20) break;
                }
              }
              const logo = document.querySelector('.logo-image');
              const portrait = document.querySelector('.about-portrait__frame img');
              const menuToggle = document.querySelector('[data-menu-toggle]');
              const panelId = menuToggle?.getAttribute('aria-controls') || '';
              const mobilePanel = panelId ? document.getElementById(panelId) : null;
              const topLanguageSwitches = document.querySelectorAll('.site-header__inner .lang-switch').length;
              const panelLanguageSwitches = mobilePanel ? mobilePanel.querySelectorAll('.lang-switch').length : 0;
              const jsonLd = Array.from(document.querySelectorAll('script[type="application/ld+json"]')).map((script) => {
                try { return { valid: true, value: JSON.parse(script.textContent || '') }; }
                catch (error) { return { valid: false, error: String(error) }; }
              });
              const focusable = Array.from(document.querySelectorAll('a[href], button:not([disabled]), input:not([disabled]), select:not([disabled]), textarea:not([disabled])'));
              const tooSmallTargets = focusable.map((el) => {
                const rect = el.getBoundingClientRect();
                return { tag: el.tagName.toLowerCase(), text: (el.textContent || el.getAttribute('aria-label') || '').trim().slice(0, 60), width: rect.width, height: rect.height };
              }).filter((item) => item.width > 0 && item.height > 0 && (item.width < 38 || item.height < 38));
              return {
                lang,
                viewport,
                title: document.title,
                h1Count: document.querySelectorAll('h1').length,
                duplicateIds: [...new Set(duplicateIds)],
                htmlScrollWidth: root.scrollWidth,
                bodyScrollWidth: body.scrollWidth,
                innerWidth: window.innerWidth,
                horizontalOverflow: root.scrollWidth > window.innerWidth + 1 || body.scrollWidth > window.innerWidth + 1,
                overflowCandidates,
                logo: logo ? { complete: logo.complete, naturalWidth: logo.naturalWidth, naturalHeight: logo.naturalHeight, currentSrc: logo.currentSrc } : null,
                portrait: portrait ? { complete: portrait.complete, naturalWidth: portrait.naturalWidth, naturalHeight: portrait.naturalHeight, currentSrc: portrait.currentSrc, objectPosition: getComputedStyle(portrait).objectPosition } : null,
                menu: menuToggle ? { ariaExpanded: menuToggle.getAttribute('aria-expanded'), ariaControls: panelId, panelFound: Boolean(mobilePanel), panelHidden: mobilePanel?.hidden ?? null, topLanguageSwitches, panelLanguageSwitches } : null,
                jsonLd,
                canonicalCount: document.querySelectorAll('link[rel="canonical"]').length,
                hreflang: Array.from(document.querySelectorAll('link[rel="alternate"][hreflang]')).map((el) => el.getAttribute('hreflang')),
                faviconHrefs: Array.from(document.querySelectorAll('link[rel~="icon"], link[rel="apple-touch-icon"]')).map((el) => el.href),
                manifestHref: document.querySelector('link[rel="manifest"]')?.href || null,
                tooSmallTargets,
                proofValues: Array.from(document.querySelectorAll('[data-proof-value]')).map((el) => el.textContent),
                performance: window.__aboutQA || null
              };
            }, { lang, viewport: viewport.name });
          }

          for (const pageDef of pages) {
            for (const viewport of viewports) {
              const context = await browser.newContext({
                viewport: { width: viewport.width, height: viewport.height },
                deviceScaleFactor: 1,
                reducedMotion: 'no-preference'
              });
              const page = await context.newPage();
              const diagnostics = { consoleErrors: [], pageErrors: [], failedFirstPartyRequests: [] };
              attachDiagnostics(page, diagnostics);
              await addPerformanceInit(page);
              await page.goto(baseURL + pageDef.path, { waitUntil: 'networkidle' });
              await revealAll(page);
              const result = await inspectPage(page, pageDef.lang, viewport);

              if (viewport.kind === 'mobile' || viewport.kind === 'landscape') {
                const toggle = page.locator('[data-menu-toggle]');
                if (await toggle.isVisible()) {
                  await toggle.click();
                  result.mobileMenuOpen = await page.evaluate(() => {
                    const toggle = document.querySelector('[data-menu-toggle]');
                    const panel = toggle ? document.getElementById(toggle.getAttribute('aria-controls')) : null;
                    return {
                      ariaExpanded: toggle?.getAttribute('aria-expanded') || null,
                      panelHidden: panel?.hidden ?? null,
                      headerVisible: Boolean(document.querySelector('[data-proto-header]')) && getComputedStyle(document.querySelector('[data-proto-header]')).transform === 'none'
                    };
                  });
                  await toggle.click();
                  result.mobileMenuClosed = await page.evaluate(() => {
                    const toggle = document.querySelector('[data-menu-toggle]');
                    const panel = toggle ? document.getElementById(toggle.getAttribute('aria-controls')) : null;
                    return { ariaExpanded: toggle?.getAttribute('aria-expanded') || null, panelHidden: panel?.hidden ?? null };
                  });
                }
              }

              await page.evaluate(() => window.scrollTo(0, 0));
              await page.keyboard.press('Tab');
              result.keyboard = await page.evaluate(() => {
                const active = document.activeElement;
                if (!active) return null;
                const style = getComputedStyle(active);
                return {
                  tag: active.tagName.toLowerCase(),
                  text: (active.textContent || active.getAttribute('aria-label') || '').trim().slice(0, 80),
                  outlineStyle: style.outlineStyle,
                  outlineWidth: style.outlineWidth
                };
              });

              result.consoleErrors = diagnostics.consoleErrors;
              result.pageErrors = diagnostics.pageErrors;
              result.failedFirstPartyRequests = diagnostics.failedFirstPartyRequests;
              report.matrix.push(result);
              report.globalConsoleErrors.push(...diagnostics.consoleErrors.map((error) => ({ lang: pageDef.lang, viewport: viewport.name, error })));
              report.globalPageErrors.push(...diagnostics.pageErrors.map((error) => ({ lang: pageDef.lang, viewport: viewport.name, error })));
              report.globalFailedFirstPartyRequests.push(...diagnostics.failedFirstPartyRequests.map((error) => ({ lang: pageDef.lang, viewport: viewport.name, ...error })));
              await context.close();
            }
          }

          async function screenshot(name, page, options = {}) {
            const filePath = path.join(screenshotDir, name);
            await page.screenshot({ path: filePath, ...options });
            report.screenshots.push(name);
          }

          async function openPage(pathname, viewport, reducedMotion = 'no-preference') {
            const context = await browser.newContext({ viewport, deviceScaleFactor: 1, reducedMotion });
            const page = await context.newPage();
            const diagnostics = { consoleErrors: [], pageErrors: [], failedFirstPartyRequests: [] };
            attachDiagnostics(page, diagnostics);
            await addPerformanceInit(page);
            await page.goto(baseURL + pathname, { waitUntil: 'networkidle' });
            return { context, page, diagnostics };
          }

          for (const spec of [
            ['01-en-about-desktop-1440x1000.png', '/about/', { width: 1440, height: 1000 }],
            ['02-ru-about-desktop-1440x1000.png', '/ru/about/', { width: 1440, height: 1000 }],
            ['03-en-about-mobile-390x844.png', '/about/', { width: 390, height: 844 }],
            ['04-ru-about-mobile-390x844.png', '/ru/about/', { width: 390, height: 844 }],
            ['05-ru-about-mobile-320x720.png', '/ru/about/', { width: 320, height: 720 }],
            ['06-en-about-landscape-844x390.png', '/about/', { width: 844, height: 390 }]
          ]) {
            const { context, page } = await openPage(spec[1], spec[2]);
            await revealAll(page);
            await screenshot(spec[0], page, { fullPage: true });
            await context.close();
          }

          {
            const { context, page } = await openPage('/about/', { width: 390, height: 844 });
            const header = page.locator('[data-proto-header]');
            await screenshot('07-mobile-header.png', page, { clip: await header.boundingBox() });
            await page.locator('[data-menu-toggle]').click();
            await screenshot('08-open-mobile-menu.png', page, { fullPage: false });
            report.focusedChecks.openMenu = await page.evaluate(() => {
              const toggle = document.querySelector('[data-menu-toggle]');
              const panel = toggle ? document.getElementById(toggle.getAttribute('aria-controls')) : null;
              return {
                ariaExpanded: toggle?.getAttribute('aria-expanded'),
                panelHidden: panel?.hidden,
                panelLanguageSwitches: panel?.querySelectorAll('.lang-switch').length || 0,
                topLanguageSwitches: document.querySelectorAll('.site-header__inner .lang-switch').length
              };
            });
            await context.close();
          }

          {
            const { context, page } = await openPage('/about/', { width: 1440, height: 1000 });
            const owner = page.locator('.about-intro-grid');
            await owner.scrollIntoViewIfNeeded();
            await page.waitForTimeout(700);
            await screenshot('09a-leadership.png', page, { clip: await owner.boundingBox() });
            const note = page.locator('.about-note');
            await note.scrollIntoViewIfNeeded();
            await page.waitForTimeout(700);
            await screenshot('09b-ceo-note.png', page, { clip: await note.boundingBox() });
            const services = page.locator('.about-services-grid');
            await services.scrollIntoViewIfNeeded();
            await page.waitForTimeout(900);
            await screenshot('10-six-services.png', page, { clip: await services.boundingBox() });
            await context.close();
          }

          {
            const { context, page } = await openPage('/about/', { width: 1440, height: 1000 });
            const proof = page.locator('[data-proof-strip]');
            const firstValue = page.locator('[data-proof-value]').first();
            await proof.scrollIntoViewIfNeeded();
            const initialWidth = await firstValue.evaluate((el) => el.getBoundingClientRect().width);
            await page.waitForTimeout(360);
            const duringValues = await page.locator('[data-proof-value]').allTextContents();
            const duringWidth = await firstValue.evaluate((el) => el.getBoundingClientRect().width);
            await screenshot('11-proof-metrics-during-count.png', page, { clip: await proof.boundingBox() });
            await page.waitForTimeout(1900);
            const finalValues = await page.locator('[data-proof-value]').allTextContents();
            const finalWidth = await firstValue.evaluate((el) => el.getBoundingClientRect().width);
            await screenshot('12-proof-metrics-after-count.png', page, { clip: await proof.boundingBox() });
            report.focusedChecks.countUp = { duringValues, finalValues, initialWidth, duringWidth, finalWidth, widthDelta: Math.max(initialWidth, duringWidth, finalWidth) - Math.min(initialWidth, duringWidth, finalWidth) };
            await context.close();
          }

          {
            const { context, page } = await openPage('/ru/about/', { width: 390, height: 844 });
            const footer = page.locator('footer.footer');
            await footer.scrollIntoViewIfNeeded();
            await page.waitForTimeout(500);
            await screenshot('13-mobile-footer.png', page, { clip: await footer.boundingBox() });
            await context.close();
          }

          {
            const { context, page } = await openPage('/about/', { width: 390, height: 844 }, 'reduce');
            const proof = page.locator('[data-proof-strip]');
            await proof.scrollIntoViewIfNeeded();
            await page.waitForTimeout(100);
            await screenshot('14-reduced-motion-state.png', page, { clip: await proof.boundingBox() });
            report.focusedChecks.reducedMotion = await page.evaluate(() => ({
              values: Array.from(document.querySelectorAll('[data-proof-value]')).map((el) => el.textContent),
              hiddenReveals: Array.from(document.querySelectorAll('.fade-in')).filter((el) => {
                const style = getComputedStyle(el);
                return Number(style.opacity) < 0.99 || style.transform !== 'none';
              }).length,
              proofSweepDisplay: getComputedStyle(document.querySelector('.about-proof-card'), '::before').display
            }));
            await context.close();
          }

          {
            const context = await browser.newContext({ viewport: { width: 320, height: 320 } });
            const page = await context.newPage();
            const responses = {};
            page.on('response', async (response) => {
              const url = response.url();
              if (url.includes('/assets/brand/financial-stream/favicon')) {
                responses[url] = { status: response.status(), contentType: response.headers()['content-type'] || null };
              }
            });
            await page.goto(baseURL + '/assets/brand/financial-stream/favicon.svg', { waitUntil: 'networkidle' });
            await screenshot('15-favicon-render.png', page, { fullPage: false });
            report.assetAudit.faviconResponses = responses;
            await context.close();
          }

          {
            const { context, page } = await openPage('/about/', { width: 1440, height: 1000 });
            report.assetAudit.pageAssets = await page.evaluate(async () => {
              const urls = [
                '/assets/brand/financial-stream/logo-primary-web.webp',
                '/assets/brand/financial-stream/logo-primary-web.png',
                '/assets/brand/financial-stream/favicon.ico',
                '/assets/brand/financial-stream/favicon.svg',
                '/assets/brand/financial-stream/apple-touch-icon.png',
                '/assets/img/about/tetiana-financial-stream-ceo.webp',
                '/site.webmanifest'
              ];
              const results = [];
              for (const url of urls) {
                try {
                  const response = await fetch(url, { cache: 'no-store' });
                  results.push({ url, status: response.status, ok: response.ok, contentType: response.headers.get('content-type'), contentLength: response.headers.get('content-length') });
                } catch (error) {
                  results.push({ url, error: String(error) });
                }
              }
              return results;
            });
            await context.close();
          }

          await browser.close();

          const failures = [];
          for (const item of report.matrix) {
            if (item.h1Count !== 1) failures.push(`${item.lang} ${item.viewport}: h1Count=${item.h1Count}`);
            if (item.duplicateIds.length) failures.push(`${item.lang} ${item.viewport}: duplicate IDs ${item.duplicateIds.join(', ')}`);
            if (item.horizontalOverflow) failures.push(`${item.lang} ${item.viewport}: scrollWidth overflow`);
            if (item.overflowCandidates.length) failures.push(`${item.lang} ${item.viewport}: visible overflow candidates ${JSON.stringify(item.overflowCandidates.slice(0, 3))}`);
            if (item.consoleErrors.length) failures.push(`${item.lang} ${item.viewport}: console errors`);
            if (item.pageErrors.length) failures.push(`${item.lang} ${item.viewport}: page errors`);
            if (item.failedFirstPartyRequests.length) failures.push(`${item.lang} ${item.viewport}: failed first-party requests`);
            if (!item.logo?.complete || item.logo.naturalWidth < 1) failures.push(`${item.lang} ${item.viewport}: logo not loaded`);
            if (!item.portrait?.complete || item.portrait.naturalWidth !== 1200 || item.portrait.naturalHeight !== 1500) failures.push(`${item.lang} ${item.viewport}: portrait dimensions/load invalid`);
            if (item.canonicalCount !== 1) failures.push(`${item.lang} ${item.viewport}: canonicalCount=${item.canonicalCount}`);
            if (!item.jsonLd.every((entry) => entry.valid)) failures.push(`${item.lang} ${item.viewport}: invalid JSON-LD`);
            if (item.menu && item.menu.topLanguageSwitches !== 1) failures.push(`${item.lang} ${item.viewport}: top language switch count ${item.menu.topLanguageSwitches}`);
            if ((item.viewport.includes('x') && Number(item.viewport.split('x')[0]) <= 844) && item.menu?.panelLanguageSwitches !== 0) failures.push(`${item.lang} ${item.viewport}: language switch duplicated in panel`);
          }
          if (report.focusedChecks.countUp?.finalValues?.join('|') !== '127+|300+') failures.push('Count-up final values are incorrect');
          if ((report.focusedChecks.countUp?.widthDelta || 0) > 1) failures.push(`Count-up width changed by ${report.focusedChecks.countUp.widthDelta}px`);
          if (report.focusedChecks.reducedMotion?.values?.join('|') !== '127+|300+') failures.push('Reduced-motion values are incorrect');
          if (report.focusedChecks.reducedMotion?.hiddenReveals !== 0) failures.push('Reduced-motion leaves hidden/transformed reveals');
          if (report.focusedChecks.openMenu?.ariaExpanded !== 'true' || report.focusedChecks.openMenu?.panelHidden !== false) failures.push('Open menu semantics invalid');
          if (report.focusedChecks.openMenu?.panelLanguageSwitches !== 0 || report.focusedChecks.openMenu?.topLanguageSwitches !== 1) failures.push('Mobile language switch duplication');
          for (const asset of report.assetAudit.pageAssets || []) {
            if (!asset.ok) failures.push(`Asset failed: ${asset.url}`);
          }

          report.failures = failures;
          report.status = failures.length ? 'FAIL' : 'PASS';
          fs.writeFileSync(path.join(outputDir, 'report.json'), JSON.stringify(report, null, 2));
          fs.copyFileSync('/tmp/about-server.log', path.join(outputDir, 'server.log'));

          const summary = [
            '# About branch QA',
            '',
            `Status: **${report.status}**`,
            `Matrix cases: ${report.matrix.length}`,
            `Screenshots: ${report.screenshots.length}`,
            `Console errors: ${report.globalConsoleErrors.length}`,
            `Page errors: ${report.globalPageErrors.length}`,
            `Failed first-party requests: ${report.globalFailedFirstPartyRequests.length}`,
            `Failures: ${failures.length}`,
            '',
            ...failures.map((failure) => `- ${failure}`)
          ].join('\n');
          fs.writeFileSync(path.join(outputDir, 'summary.md'), summary);
          console.log(summary);
          if (failures.length) process.exitCode = 1;
          EOF
          node /tmp/about-qa.mjs

      - name: Upload QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: about-branch-qa-${{ github.sha }}
          path: about-qa-artifacts
          if-no-files-found: error
          retention-days: 14
