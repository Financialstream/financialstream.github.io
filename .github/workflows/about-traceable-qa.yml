name: About Traceable QA

on:
  push:
    branches:
      - agent/about-premium-motion-polish-v1

permissions:
  contents: write

jobs:
  about-traceable-qa:
    if: github.event.head_commit.message == 'Trigger traceable About QA'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/about-premium-motion-polish-v1

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start local server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/about-server.log 2>&1 &
          echo $! > /tmp/about-server.pid
          sleep 2

      - name: Run matrix and capture evidence
        run: |
          cat > /tmp/about-traceable-qa.mjs <<'EOF'
          import { chromium } from 'playwright';
          import fs from 'node:fs';
          import path from 'node:path';

          const baseURL = 'http://127.0.0.1:4173';
          const out = path.resolve('about-traceable-qa');
          const shots = path.join(out, 'screenshots');
          fs.rmSync(out, { recursive: true, force: true });
          fs.mkdirSync(shots, { recursive: true });

          const pages = [
            { lang: 'EN', route: '/about/' },
            { lang: 'RU', route: '/ru/about/' }
          ];
          const viewports = [
            ['1440x1000', 1440, 1000, 'desktop'],
            ['1280x900', 1280, 900, 'desktop'],
            ['1024x768', 1024, 768, 'tablet'],
            ['768x1024', 768, 1024, 'tablet'],
            ['430x932', 430, 932, 'mobile'],
            ['390x844', 390, 844, 'mobile'],
            ['375x812', 375, 812, 'mobile'],
            ['360x800', 360, 800, 'mobile'],
            ['320x720', 320, 720, 'mobile'],
            ['844x390', 844, 390, 'landscape'],
            ['932x430', 932, 430, 'landscape']
          ].map(([name, width, height, kind]) => ({ name, width, height, kind }));

          const browser = await chromium.launch({ headless: true });
          const report = {
            runId: process.env.GITHUB_RUN_ID || null,
            headSha: process.env.GITHUB_SHA || null,
            generatedAt: new Date().toISOString(),
            matrix: [],
            focused: {},
            assets: [],
            screenshots: [],
            failures: []
          };

          function diagnostics(page) {
            const data = { consoleErrors: [], pageErrors: [], failedFirstParty: [] };
            page.on('console', (message) => {
              if (message.type() === 'error') data.consoleErrors.push(message.text());
            });
            page.on('pageerror', (error) => data.pageErrors.push(String(error)));
            page.on('requestfailed', (request) => {
              if (request.url().startsWith(baseURL)) {
                data.failedFirstParty.push({ url: request.url(), error: request.failure()?.errorText || 'unknown' });
              }
            });
            return data;
          }

          async function open(route, viewport, reducedMotion = 'no-preference') {
            const context = await browser.newContext({
              viewport: { width: viewport.width, height: viewport.height },
              deviceScaleFactor: 1,
              reducedMotion
            });
            const page = await context.newPage();
            const events = diagnostics(page);
            await page.addInitScript(() => {
              window.__qaPerf = { cls: 0, longTasks: [] };
              try {
                new PerformanceObserver((list) => {
                  for (const entry of list.getEntries()) {
                    if (!entry.hadRecentInput) window.__qaPerf.cls += entry.value;
                  }
                }).observe({ type: 'layout-shift', buffered: true });
              } catch {}
              try {
                new PerformanceObserver((list) => {
                  for (const entry of list.getEntries()) window.__qaPerf.longTasks.push(Math.round(entry.duration));
                }).observe({ type: 'longtask', buffered: true });
              } catch {}
            });
            await page.goto(baseURL + route, { waitUntil: 'networkidle', timeout: 60000 });
            return { context, page, events };
          }

          async function scrollThrough(page) {
            await page.evaluate(async () => {
              const step = Math.max(260, Math.floor(innerHeight * 0.68));
              for (let y = 0; y <= document.documentElement.scrollHeight; y += step) {
                scrollTo(0, y);
                await new Promise((resolve) => setTimeout(resolve, 75));
              }
              scrollTo(0, document.documentElement.scrollHeight);
            });
            await page.waitForTimeout(900);
          }

          async function inspect(page, lang, viewport, events) {
            return page.evaluate(({ lang, viewport, events }) => {
              const html = document.documentElement;
              const body = document.body;
              const ids = [...document.querySelectorAll('[id]')].map((node) => node.id);
              const duplicates = [...new Set(ids.filter((id, index) => ids.indexOf(id) !== index))];
              const overflow = [];
              for (const node of document.querySelectorAll('body *')) {
                const style = getComputedStyle(node);
                if (style.display === 'none' || style.visibility === 'hidden' || style.position === 'fixed') continue;
                const rect = node.getBoundingClientRect();
                if (rect.width < 1 || rect.height < 1) continue;
                if (rect.left < -1 || rect.right > innerWidth + 1) {
                  overflow.push({
                    tag: node.tagName.toLowerCase(),
                    className: String(node.className || '').slice(0, 100),
                    left: Math.round(rect.left * 10) / 10,
                    right: Math.round(rect.right * 10) / 10,
                    width: Math.round(rect.width * 10) / 10
                  });
                  if (overflow.length === 12) break;
                }
              }
              const logo = document.querySelector('.logo-image');
              const portrait = document.querySelector('.about-portrait__frame img');
              const toggle = document.querySelector('[data-menu-toggle]');
              const panel = toggle ? document.getElementById(toggle.getAttribute('aria-controls')) : null;
              const jsonLd = [...document.querySelectorAll('script[type="application/ld+json"]')].map((node) => {
                try { return { valid: true, value: JSON.parse(node.textContent || '') }; }
                catch (error) { return { valid: false, error: String(error) }; }
              });
              return {
                lang,
                viewport,
                h1Count: document.querySelectorAll('h1').length,
                duplicateIds: duplicates,
                htmlScrollWidth: html.scrollWidth,
                bodyScrollWidth: body.scrollWidth,
                innerWidth,
                horizontalOverflow: html.scrollWidth > innerWidth + 1 || body.scrollWidth > innerWidth + 1,
                overflow,
                logo: logo ? { complete: logo.complete, width: logo.naturalWidth, height: logo.naturalHeight, currentSrc: logo.currentSrc } : null,
                portrait: portrait ? { complete: portrait.complete, width: portrait.naturalWidth, height: portrait.naturalHeight, currentSrc: portrait.currentSrc, objectPosition: getComputedStyle(portrait).objectPosition } : null,
                canonicalCount: document.querySelectorAll('link[rel="canonical"]').length,
                hreflang: [...document.querySelectorAll('link[rel="alternate"][hreflang]')].map((node) => node.getAttribute('hreflang')),
                jsonLd,
                topLanguageSwitches: document.querySelectorAll('.site-header__inner .lang-switch').length,
                panelLanguageSwitches: panel ? panel.querySelectorAll('.lang-switch').length : 0,
                menuPanelFound: Boolean(panel),
                menuExpanded: toggle?.getAttribute('aria-expanded') || null,
                menuHidden: panel?.hidden ?? null,
                proofValues: [...document.querySelectorAll('[data-proof-value]')].map((node) => node.textContent),
                perf: window.__qaPerf,
                events
              };
            }, { lang, viewport: viewport.name, events });
          }

          for (const pageDef of pages) {
            for (const viewport of viewports) {
              const { context, page, events } = await open(pageDef.route, viewport);
              await scrollThrough(page);
              const item = await inspect(page, pageDef.lang, viewport, events);
              const toggle = page.locator('[data-menu-toggle]');
              if ((viewport.kind === 'mobile' || viewport.kind === 'landscape') && await toggle.isVisible()) {
                await toggle.click();
                item.openMenu = await page.evaluate(() => {
                  const button = document.querySelector('[data-menu-toggle]');
                  const panel = button ? document.getElementById(button.getAttribute('aria-controls')) : null;
                  return {
                    expanded: button?.getAttribute('aria-expanded'),
                    hidden: panel?.hidden,
                    topLanguageSwitches: document.querySelectorAll('.site-header__inner .lang-switch').length,
                    panelLanguageSwitches: panel?.querySelectorAll('.lang-switch').length || 0
                  };
                });
                await toggle.click();
                item.closedMenu = await page.evaluate(() => {
                  const button = document.querySelector('[data-menu-toggle]');
                  const panel = button ? document.getElementById(button.getAttribute('aria-controls')) : null;
                  return { expanded: button?.getAttribute('aria-expanded'), hidden: panel?.hidden };
                });
              }
              await page.evaluate(() => scrollTo(0, 0));
              await page.keyboard.press('Tab');
              item.keyboard = await page.evaluate(() => {
                const active = document.activeElement;
                const style = active ? getComputedStyle(active) : null;
                return active && style ? {
                  tag: active.tagName.toLowerCase(),
                  text: (active.textContent || active.getAttribute('aria-label') || '').trim().slice(0, 80),
                  outlineStyle: style.outlineStyle,
                  outlineWidth: style.outlineWidth
                } : null;
              });
              report.matrix.push(item);
              await context.close();
            }
          }

          async function capture(name, route, viewport, action, options = {}) {
            const { context, page } = await open(route, viewport, options.reducedMotion || 'no-preference');
            if (action) await action(page);
            const target = options.selector ? page.locator(options.selector) : null;
            const screenshotOptions = { path: path.join(shots, name) };
            if (target) screenshotOptions.clip = await target.boundingBox();
            else screenshotOptions.fullPage = options.fullPage ?? true;
            await page.screenshot(screenshotOptions);
            report.screenshots.push(name);
            await context.close();
          }

          const desktop = { name: '1440x1000', width: 1440, height: 1000 };
          const mobile390 = { name: '390x844', width: 390, height: 844 };
          const mobile320 = { name: '320x720', width: 320, height: 720 };
          const landscape = { name: '844x390', width: 844, height: 390 };

          await capture('01-en-about-desktop-1440x1000.png', '/about/', desktop, scrollThrough, { fullPage: true });
          await capture('02-ru-about-desktop-1440x1000.png', '/ru/about/', desktop, scrollThrough, { fullPage: true });
          await capture('03-en-about-mobile-390x844.png', '/about/', mobile390, scrollThrough, { fullPage: true });
          await capture('04-ru-about-mobile-390x844.png', '/ru/about/', mobile390, scrollThrough, { fullPage: true });
          await capture('05-ru-about-mobile-320x720.png', '/ru/about/', mobile320, scrollThrough, { fullPage: true });
          await capture('06-en-about-landscape-844x390.png', '/about/', landscape, scrollThrough, { fullPage: true });
          await capture('07-mobile-header.png', '/about/', mobile390, null, { selector: '[data-proto-header]' });
          await capture('08-open-mobile-menu.png', '/about/', mobile390, async (page) => { await page.locator('[data-menu-toggle]').click(); await page.waitForTimeout(250); }, { fullPage: false });
          await capture('09a-leadership.png', '/about/', desktop, async (page) => { await page.locator('.about-intro-grid').scrollIntoViewIfNeeded(); await page.waitForTimeout(750); }, { selector: '.about-intro-grid' });
          await capture('09b-ceo-note.png', '/about/', desktop, async (page) => { await page.locator('.about-note').scrollIntoViewIfNeeded(); await page.waitForTimeout(750); }, { selector: '.about-note' });
          await capture('10-six-services.png', '/about/', desktop, async (page) => { await page.locator('.about-services-grid').scrollIntoViewIfNeeded(); await page.waitForTimeout(950); }, { selector: '.about-services-grid' });

          {
            const { context, page } = await open('/about/', desktop);
            const proof = page.locator('[data-proof-strip]');
            const firstValue = page.locator('[data-proof-value]').first();
            await proof.scrollIntoViewIfNeeded();
            const initialWidth = await firstValue.evaluate((node) => node.getBoundingClientRect().width);
            await page.waitForTimeout(360);
            const duringValues = await page.locator('[data-proof-value]').allTextContents();
            const duringWidth = await firstValue.evaluate((node) => node.getBoundingClientRect().width);
            await page.screenshot({ path: path.join(shots, '11-proof-metrics-during-count.png'), clip: await proof.boundingBox() });
            report.screenshots.push('11-proof-metrics-during-count.png');
            await page.waitForTimeout(1900);
            const finalValues = await page.locator('[data-proof-value]').allTextContents();
            const finalWidth = await firstValue.evaluate((node) => node.getBoundingClientRect().width);
            await page.screenshot({ path: path.join(shots, '12-proof-metrics-after-count.png'), clip: await proof.boundingBox() });
            report.screenshots.push('12-proof-metrics-after-count.png');
            report.focused.countUp = { initialWidth, duringWidth, finalWidth, widthDelta: Math.max(initialWidth, duringWidth, finalWidth) - Math.min(initialWidth, duringWidth, finalWidth), duringValues, finalValues };
            await context.close();
          }

          await capture('13-mobile-footer.png', '/ru/about/', mobile390, async (page) => { await page.locator('footer.footer').scrollIntoViewIfNeeded(); await page.waitForTimeout(500); }, { selector: 'footer.footer' });

          {
            const { context, page } = await open('/about/', mobile390, 'reduce');
            const proof = page.locator('[data-proof-strip]');
            await proof.scrollIntoViewIfNeeded();
            await page.waitForTimeout(120);
            await page.screenshot({ path: path.join(shots, '14-reduced-motion-state.png'), clip: await proof.boundingBox() });
            report.screenshots.push('14-reduced-motion-state.png');
            report.focused.reducedMotion = await page.evaluate(() => ({
              values: [...document.querySelectorAll('[data-proof-value]')].map((node) => node.textContent),
              hiddenReveals: [...document.querySelectorAll('.fade-in')].filter((node) => {
                const style = getComputedStyle(node);
                return Number(style.opacity) < 0.99 || style.transform !== 'none';
              }).length,
              sweepDisplay: getComputedStyle(document.querySelector('.about-proof-card'), '::before').display
            }));
            await context.close();
          }

          {
            const context = await browser.newContext({ viewport: { width: 320, height: 320 } });
            const page = await context.newPage();
            await page.goto(baseURL + '/assets/brand/financial-stream/favicon.svg', { waitUntil: 'networkidle' });
            await page.screenshot({ path: path.join(shots, '15-favicon-render.png') });
            report.screenshots.push('15-favicon-render.png');
            await context.close();
          }

          {
            const { context, page } = await open('/about/', desktop);
            report.assets = await page.evaluate(async () => {
              const urls = [
                '/assets/brand/financial-stream/logo-primary-web.webp',
                '/assets/brand/financial-stream/logo-primary-web.png',
                '/assets/brand/financial-stream/favicon.ico',
                '/assets/brand/financial-stream/favicon.svg',
                '/assets/brand/financial-stream/favicon-32x32.png',
                '/assets/brand/financial-stream/apple-touch-icon.png',
                '/assets/img/about/tetiana-financial-stream-ceo.webp',
                '/site.webmanifest'
              ];
              const result = [];
              for (const url of urls) {
                try {
                  const response = await fetch(url, { cache: 'no-store' });
                  result.push({ url, status: response.status, ok: response.ok, contentType: response.headers.get('content-type'), contentLength: response.headers.get('content-length') });
                } catch (error) {
                  result.push({ url, ok: false, error: String(error) });
                }
              }
              return result;
            });
            await context.close();
          }

          await browser.close();

          for (const item of report.matrix) {
            const label = `${item.lang} ${item.viewport}`;
            if (item.h1Count !== 1) report.failures.push(`${label}: expected one H1, found ${item.h1Count}`);
            if (item.duplicateIds.length) report.failures.push(`${label}: duplicate IDs ${item.duplicateIds.join(', ')}`);
            if (item.horizontalOverflow) report.failures.push(`${label}: document scrollWidth exceeds viewport`);
            if (item.overflow.length) report.failures.push(`${label}: visible horizontal overflow ${JSON.stringify(item.overflow.slice(0, 2))}`);
            if (item.events.consoleErrors.length) report.failures.push(`${label}: console errors ${JSON.stringify(item.events.consoleErrors)}`);
            if (item.events.pageErrors.length) report.failures.push(`${label}: page errors ${JSON.stringify(item.events.pageErrors)}`);
            if (item.events.failedFirstParty.length) report.failures.push(`${label}: failed first-party requests ${JSON.stringify(item.events.failedFirstParty)}`);
            if (!item.logo?.complete || !item.logo.width) report.failures.push(`${label}: logo failed to load`);
            if (!item.portrait?.complete || item.portrait.width !== 1200 || item.portrait.height !== 1500) report.failures.push(`${label}: portrait load or dimensions invalid`);
            if (item.canonicalCount !== 1) report.failures.push(`${label}: canonical count ${item.canonicalCount}`);
            if (!item.jsonLd.every((entry) => entry.valid)) report.failures.push(`${label}: invalid JSON-LD`);
            if (item.topLanguageSwitches !== 1 || item.panelLanguageSwitches !== 0) report.failures.push(`${label}: language switch duplication`);
            if (item.openMenu && (item.openMenu.expanded !== 'true' || item.openMenu.hidden !== false || item.openMenu.panelLanguageSwitches !== 0)) report.failures.push(`${label}: open menu semantics invalid`);
            if (item.closedMenu && (item.closedMenu.expanded !== 'false' || item.closedMenu.hidden !== true)) report.failures.push(`${label}: closed menu semantics invalid`);
            if (!item.keyboard || item.keyboard.outlineStyle === 'none' || item.keyboard.outlineWidth === '0px') report.failures.push(`${label}: keyboard focus not visible`);
          }
          if (report.focused.countUp?.finalValues?.join('|') !== '127+|300+') report.failures.push('Count-up final values are not exactly 127+ and 300+');
          if ((report.focused.countUp?.widthDelta || 0) > 1) report.failures.push(`Count-up width shifted by ${report.focused.countUp.widthDelta}px`);
          if (report.focused.reducedMotion?.values?.join('|') !== '127+|300+') report.failures.push('Reduced-motion proof values are incorrect');
          if (report.focused.reducedMotion?.hiddenReveals !== 0) report.failures.push('Reduced-motion leaves reveal elements hidden or transformed');
          for (const asset of report.assets) if (!asset.ok) report.failures.push(`Asset failed: ${asset.url}`);

          report.status = report.failures.length ? 'FAIL' : 'PASS';
          fs.writeFileSync(path.join(out, 'report.json'), JSON.stringify(report, null, 2));
          fs.writeFileSync(path.join(out, 'summary.md'), [
            '# Financial Stream About QA',
            '',
            `Status: **${report.status}**`,
            `Head SHA: ${report.headSha}`,
            `Run ID: ${report.runId}`,
            `Viewport cases: ${report.matrix.length}`,
            `Screenshots: ${report.screenshots.length}`,
            `Failures: ${report.failures.length}`,
            '',
            ...report.failures.map((failure) => `- ${failure}`)
          ].join('\n'));
          fs.copyFileSync('/tmp/about-server.log', path.join(out, 'server.log'));
          console.log(JSON.stringify({ status: report.status, failures: report.failures }, null, 2));
          EOF
          node /tmp/about-traceable-qa.mjs

      - name: Upload traceable QA artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: about-traceable-qa-${{ github.run_id }}
          path: about-traceable-qa
          if-no-files-found: error
          retention-days: 14

      - name: Publish run ID to branch
        if: always()
        run: |
          mkdir -p docs/qa
          printf '%s\n' '${{ github.run_id }}' > docs/qa/about-traceable-run-id.txt
          printf '%s\n' '${{ github.sha }}' > docs/qa/about-traceable-head-sha.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/qa/about-traceable-run-id.txt docs/qa/about-traceable-head-sha.txt
          git commit -m 'Record About QA run ID [skip ci]'
          git push origin HEAD:agent/about-premium-motion-polish-v1

      - name: Enforce QA gate
        if: always()
        run: |
          python3 - <<'PY'
          import json,sys
          report=json.load(open('about-traceable-qa/report.json',encoding='utf-8'))
          if report['status'] != 'PASS':
              print('\n'.join(report['failures']))
              sys.exit(1)
          print('About traceable QA PASS')
          PY
