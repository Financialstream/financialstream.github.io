name: Integrate flagship hero image

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches: [main]

permissions:
  contents: write

jobs:
  integrate-and-qa:
    if: github.head_ref == 'agent/integrate-flagship-hero-image'
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Retrieve and verify exact Drive asset
        shell: bash
        run: |
          set -euo pipefail
          target="assets/img/blog/financial-stream-flagship-bookkeeping-hero.webp"
          tmp="$(mktemp)"
          mkdir -p "$(dirname "$target")"

          urls=(
            "https://drive.usercontent.google.com/download?id=1IkBXcwxXrAnGinJZYqSNq3m0JxBl88lF&export=download&confirm=t"
            "https://drive.google.com/uc?export=download&id=1IkBXcwxXrAnGinJZYqSNq3m0JxBl88lF"
          )

          retrieved=false
          for url in "${urls[@]}"; do
            rm -f "$tmp"
            if curl --fail --location --silent --show-error --retry 3 --retry-delay 2 "$url" --output "$tmp"; then
              if [[ "$(stat -c%s "$tmp")" == "89056" ]] && [[ "$(sha256sum "$tmp" | awk '{print $1}')" == "fbdfdebe7150c9d420d616a96c56ceb53d1397880612ae85e65a5793c0095bd7" ]]; then
                mv "$tmp" "$target"
                retrieved=true
                break
              fi
            fi
          done

          [[ "$retrieved" == true ]]

          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import struct

          path = Path("assets/img/blog/financial-stream-flagship-bookkeeping-hero.webp")
          data = path.read_bytes()
          assert len(data) == 89056
          assert hashlib.sha256(data).hexdigest() == "fbdfdebe7150c9d420d616a96c56ceb53d1397880612ae85e65a5793c0095bd7"
          assert data[:4] == b"RIFF" and data[8:12] == b"WEBP"

          width = height = None
          offset = 12
          while offset + 8 <= len(data):
              fourcc = data[offset:offset + 4]
              size = struct.unpack_from("<I", data, offset + 4)[0]
              payload = data[offset + 8:offset + 8 + size]
              if fourcc == b"VP8X" and len(payload) >= 10:
                  width = 1 + int.from_bytes(payload[4:7], "little")
                  height = 1 + int.from_bytes(payload[7:10], "little")
                  break
              if fourcc == b"VP8 " and len(payload) >= 10 and payload[3:6] == b"\x9d\x01\x2a":
                  width = int.from_bytes(payload[6:8], "little") & 0x3FFF
                  height = int.from_bytes(payload[8:10], "little") & 0x3FFF
                  break
              if fourcc == b"VP8L" and len(payload) >= 5 and payload[0] == 0x2F:
                  bits = int.from_bytes(payload[1:5], "little")
                  width = (bits & 0x3FFF) + 1
                  height = ((bits >> 14) & 0x3FFF) + 1
                  break
              offset += 8 + size + (size & 1)

          assert (width, height) == (1086, 1448), (width, height)
          assert width * 4 == height * 3
          print("Verified exact WebP: 1086x1448, 89056 bytes, SHA-256 matched")
          PY

      - name: Apply scoped article changes
        shell: bash
        run: |
          set -euo pipefail
          cat > assets/css/flagship-hero-image.css <<'CSS'
          /* Scoped presentation for the flagship article hero image. */
          .flagship-article .flagship-hero {
            grid-template-columns: minmax(0, 1.52fr) minmax(320px, 0.98fr);
            gap: clamp(32px, 4vw, 48px);
            align-items: center;
          }

          .flagship-article .flagship-hero-media {
            width: min(100%, 460px);
            aspect-ratio: 3 / 4;
            margin: 0;
            justify-self: end;
            overflow: hidden;
            border: 1px solid rgba(22, 67, 99, 0.12);
            border-radius: 28px;
            background: rgba(255, 255, 255, 0.72);
            box-shadow: 0 24px 60px rgba(22, 67, 99, 0.14);
          }

          .flagship-article .flagship-hero-media img {
            display: block;
            width: 100%;
            height: 100%;
            max-width: none;
            object-fit: cover;
            object-position: 50% 50%;
          }

          @media (max-width: 1100px) {
            .flagship-article .flagship-hero {
              grid-template-columns: minmax(0, 1.5fr) minmax(300px, 1fr);
              gap: 32px;
            }

            .flagship-article .flagship-hero-media {
              width: min(100%, 420px);
            }
          }

          @media (max-width: 900px) {
            .flagship-article .flagship-hero {
              grid-template-columns: minmax(0, 1fr);
              align-items: start;
              gap: 30px;
            }

            .flagship-article .flagship-hero-media {
              width: 100%;
              max-width: none;
              aspect-ratio: 4 / 3;
              justify-self: stretch;
            }

            .flagship-article .flagship-hero-media img {
              object-position: 50% 62%;
            }
          }

          @media (max-width: 640px) {
            .flagship-article .flagship-hero {
              gap: 24px;
            }

            .flagship-article .flagship-hero-media {
              aspect-ratio: 6 / 5;
              border-radius: 26px;
            }
          }
          CSS

          python3 - <<'PY'
          from pathlib import Path
          import json
          import re

          asset = "/assets/img/blog/financial-stream-flagship-bookkeeping-hero.webp"
          old_control = '<div class="hero-control" aria-hidden="true"><span class="hero-control__line"></span><span class="hero-control__node">1</span><span class="hero-control__node">2</span><span class="hero-control__node">3</span><span class="hero-control__node">4</span><span class="hero-control__node">5</span><span class="hero-control__node">6</span></div>'

          pages = [
              {
                  "path": Path("blog/us-bookkeeping-small-business.html"),
                  "prefix": "../",
                  "alt": "Organized bookkeeping documents and financial reports reviewed for a small-business decision",
              },
              {
                  "path": Path("ru/blog/buhgalteriya-ssha-malogo-biznesa.html"),
                  "prefix": "../../",
                  "alt": "Проверка бухгалтерских документов и финансового отчёта перед решением владельца бизнеса",
              },
          ]

          for page in pages:
              path = page["path"]
              original = path.read_text(encoding="utf-8")
              prefix = page["prefix"]
              preload = f'<link rel="preload" as="image" href="{asset}" type="image/webp">\n'
              css_link = f'<link rel="stylesheet" href="{prefix}assets/css/flagship-hero-image.css">\n'
              apple_marker = f'<link rel="apple-touch-icon" href="{prefix}assets/brand/financial-stream/apple-touch-icon.png">\n'
              author_marker = f'<link rel="stylesheet" href="{prefix}assets/css/flagship-author.css">\n'
              figure = (
                  '<figure class="flagship-hero-media">\n'
                  f'<img src="{asset}" alt="{page["alt"]}" width="1086" height="1448" loading="eager" fetchpriority="high" decoding="async">\n'
                  '</figure>'
              )

              assert original.count(old_control) == 1
              assert asset not in original
              assert original.count(apple_marker) == 1
              assert original.count(author_marker) == 1

              schema_before = re.search(r'<script type="application/ld\+json" data-schema="financial-stream-flagship">(.*?)</script>', original, re.S)
              assert schema_before
              json.loads(schema_before.group(1))

              modified = original.replace(apple_marker, apple_marker + preload, 1)
              modified = modified.replace(author_marker, author_marker + css_link, 1)
              modified = modified.replace(old_control, figure, 1)

              schema_after = re.search(r'<script type="application/ld\+json" data-schema="financial-stream-flagship">(.*?)</script>', modified, re.S)
              assert schema_after and schema_after.group(1) == schema_before.group(1)
              json.loads(schema_after.group(1))
              assert modified.count('class="chain-flow"') == original.count('class="chain-flow"') == 1
              assert 'class="hero-control"' not in modified
              assert modified.count(f'rel="preload" as="image" href="{asset}"') == 1
              assert modified.count('flagship-hero-image.css') == 1
              assert modified.count('class="flagship-author"') == original.count('class="flagship-author"') == 1
              assert modified.count('rel="canonical"') == original.count('rel="canonical"')
              assert modified.count('hreflang=') == original.count('hreflang=')
              assert modified.count('rel="icon"') == original.count('rel="icon"')

              roundtrip = modified.replace(preload, "", 1)
              roundtrip = roundtrip.replace(css_link, "", 1)
              roundtrip = roundtrip.replace(figure, old_control, 1)
              assert roundtrip == original, f"Unexpected content change in {path}"

              path.write_text(modified, encoding="utf-8", newline="")

          css_lines = Path("assets/css/flagship-hero-image.css").read_text(encoding="utf-8").splitlines()
          assert len(css_lines) < 180
          print("Applied exact scoped markup/CSS changes; locked content round-trip verified")
          PY

          git diff --check

      - name: Responsive browser QA
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/flagship-hero-qa
          cd /tmp/flagship-hero-qa
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0 >/dev/null
          npx playwright install chromium >/dev/null

          cd "$GITHUB_WORKSPACE"
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/flagship-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT

          for _ in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/blog/us-bookkeeping-small-business.html >/dev/null; then
              break
            fi
            sleep 1
          done

          node <<'JS'
          const { chromium } = require('/tmp/flagship-hero-qa/node_modules/playwright');

          const widths = [1440, 1280, 1100, 1024, 900, 768, 430, 390, 375, 360, 320];
          const pages = [
            {
              path: '/blog/us-bookkeeping-small-business.html',
              alt: 'Organized bookkeeping documents and financial reports reviewed for a small-business decision'
            },
            {
              path: '/ru/blog/buhgalteriya-ssha-malogo-biznesa.html',
              alt: 'Проверка бухгалтерских документов и финансового отчёта перед решением владельца бизнеса'
            }
          ];

          function assert(condition, message) {
            if (!condition) throw new Error(message);
          }

          (async () => {
            const browser = await chromium.launch({ headless: true });
            try {
              for (const spec of pages) {
                for (const width of widths) {
                  const page = await browser.newPage({ viewport: { width, height: 1000 }, deviceScaleFactor: 1 });
                  const consoleErrors = [];
                  const pageErrors = [];
                  page.on('console', msg => { if (msg.type() === 'error') consoleErrors.push(msg.text()); });
                  page.on('pageerror', error => pageErrors.push(error.message));

                  const response = await page.goto(`http://127.0.0.1:4173${spec.path}`, { waitUntil: 'domcontentloaded' });
                  assert(response && response.status() === 200, `${spec.path} ${width}: document HTTP status`);
                  await page.locator('.flagship-hero-media img').waitFor({ state: 'visible' });
                  await page.waitForFunction(() => {
                    const image = document.querySelector('.flagship-hero-media img');
                    return image && image.complete && image.naturalWidth > 0;
                  });

                  const result = await page.evaluate(({ width, expectedAlt }) => {
                    const hero = document.querySelector('.flagship-hero');
                    const copy = document.querySelector('.hero-copy');
                    const h1 = document.querySelector('.hero-copy h1');
                    const media = document.querySelector('.flagship-hero-media');
                    const image = media.querySelector('img');
                    const meta = document.querySelector('.article-meta-row');
                    const author = document.querySelector('.flagship-author');
                    const authorImage = author && author.querySelector('img');
                    const rect = element => element.getBoundingClientRect();
                    const hr = rect(hero), cr = rect(copy), tr = rect(h1), mr = rect(media);
                    const overlap = !(tr.right <= mr.left || tr.left >= mr.right || tr.bottom <= mr.top || tr.top >= mr.bottom);
                    const mediaRatio = mr.width / mr.height;
                    const computedImage = getComputedStyle(image);
                    const computedMedia = getComputedStyle(media);
                    return {
                      oldControlCount: document.querySelectorAll('.hero-control').length,
                      chainCount: document.querySelectorAll('.chain-flow').length,
                      imageCount: document.querySelectorAll('.flagship-hero-media img').length,
                      imageAlt: image.getAttribute('alt'),
                      widthAttr: image.getAttribute('width'),
                      heightAttr: image.getAttribute('height'),
                      loading: image.getAttribute('loading'),
                      fetchpriority: image.getAttribute('fetchpriority'),
                      decoding: image.getAttribute('decoding'),
                      naturalWidth: image.naturalWidth,
                      naturalHeight: image.naturalHeight,
                      imageSrc: image.getAttribute('src'),
                      objectFit: computedImage.objectFit,
                      objectPosition: computedImage.objectPosition,
                      imageOpacity: Number(computedImage.opacity),
                      mediaDisplay: computedMedia.display,
                      overlap,
                      mediaRatio,
                      mediaWidth: mr.width,
                      mediaBelowCopy: mr.top >= cr.bottom - 1,
                      mediaRightOfCopy: mr.left >= cr.right - 1,
                      heroWidth: hr.width,
                      metaVisible: !!meta && getComputedStyle(meta).display !== 'none' && getComputedStyle(meta).visibility !== 'hidden',
                      authorVisible: !!author && getComputedStyle(author).display !== 'none',
                      authorImage: authorImage && authorImage.getAttribute('src'),
                      ctaCount: document.querySelectorAll('a.btn.btn-primary').length,
                      faviconCount: document.querySelectorAll('link[rel="icon"]').length,
                      preloadCount: document.querySelectorAll('link[rel="preload"][as="image"][href="/assets/img/blog/financial-stream-flagship-bookkeeping-hero.webp"]').length,
                      cssCount: [...document.querySelectorAll('link[rel="stylesheet"]')].filter(link => link.href.endsWith('/assets/css/flagship-hero-image.css')).length,
                      horizontalOverflow: document.documentElement.scrollWidth > document.documentElement.clientWidth + 1,
                      width
                    };
                  }, { width, expectedAlt: spec.alt });

                  assert(result.oldControlCount === 0, `${spec.path} ${width}: old hero control remains`);
                  assert(result.chainCount === 1, `${spec.path} ${width}: body six-step visual missing`);
                  assert(result.imageCount === 1, `${spec.path} ${width}: hero image count`);
                  assert(result.imageAlt === spec.alt, `${spec.path} ${width}: alt mismatch`);
                  assert(result.widthAttr === '1086' && result.heightAttr === '1448', `${spec.path} ${width}: intrinsic dimensions missing`);
                  assert(result.loading === 'eager' && result.fetchpriority === 'high' && result.decoding === 'async', `${spec.path} ${width}: loading attributes`);
                  assert(result.naturalWidth === 1086 && result.naturalHeight === 1448, `${spec.path} ${width}: decoded dimensions`);
                  assert(result.imageSrc === '/assets/img/blog/financial-stream-flagship-bookkeeping-hero.webp', `${spec.path} ${width}: image path`);
                  assert(result.objectFit === 'cover', `${spec.path} ${width}: object-fit`);
                  assert(result.imageOpacity > 0.99, `${spec.path} ${width}: image opacity`);
                  assert(!result.overlap, `${spec.path} ${width}: H1 overlaps image`);
                  assert(result.metaVisible && result.authorVisible && result.ctaCount > 0, `${spec.path} ${width}: metadata/author/CTA visibility`);
                  assert(result.authorImage && result.authorImage.includes('tetiana-horb-ceo'), `${spec.path} ${width}: author portrait changed`);
                  assert(result.faviconCount >= 2 && result.preloadCount === 1 && result.cssCount === 1, `${spec.path} ${width}: head assets`);
                  assert(!result.horizontalOverflow, `${spec.path} ${width}: horizontal overflow`);

                  if (width > 900) {
                    assert(result.mediaRightOfCopy, `${spec.path} ${width}: desktop image not right of copy`);
                    assert(Math.abs(result.mediaRatio - 0.75) < 0.03, `${spec.path} ${width}: desktop ratio ${result.mediaRatio}`);
                    assert(result.mediaWidth >= 299 && result.mediaWidth <= 481, `${spec.path} ${width}: desktop image width ${result.mediaWidth}`);
                  } else {
                    assert(result.mediaBelowCopy, `${spec.path} ${width}: mobile/tablet image not below copy`);
                    const expectedRatio = width <= 640 ? 1.2 : 4 / 3;
                    assert(Math.abs(result.mediaRatio - expectedRatio) < 0.04, `${spec.path} ${width}: responsive ratio ${result.mediaRatio}`);
                    assert(result.objectPosition === '50% 62%', `${spec.path} ${width}: crop position ${result.objectPosition}`);
                  }

                  assert(consoleErrors.length === 0, `${spec.path} ${width}: console errors: ${consoleErrors.join(' | ')}`);
                  assert(pageErrors.length === 0, `${spec.path} ${width}: page errors: ${pageErrors.join(' | ')}`);
                  await page.close();
                }
              }
            } finally {
              await browser.close();
            }
            console.log('Responsive QA passed for EN and RU at all 11 required widths');
          })().catch(error => {
            console.error(error);
            process.exit(1);
          });
          JS

          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:4173/assets/img/blog/financial-stream-flagship-bookkeeping-hero.webp)" = "200"
          test "$(curl --silent --head http://127.0.0.1:4173/assets/img/blog/financial-stream-flagship-bookkeeping-hero.webp | tr -d '\r' | awk -F': ' 'tolower($1)=="content-type" {print $2}')" = "image/webp"
          test "$(curl --silent http://127.0.0.1:4173/assets/img/blog/financial-stream-flagship-bookkeeping-hero.webp | wc -c)" = "89056"

      - name: Commit only the approved four-file diff
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          rm .github/workflows/agent-integrate-flagship-hero.yml
          git add -A

          mapfile -t changed < <(git diff --cached --name-only origin/main | sort)
          expected=(
            "assets/css/flagship-hero-image.css"
            "assets/img/blog/financial-stream-flagship-bookkeeping-hero.webp"
            "blog/us-bookkeeping-small-business.html"
            "ru/blog/buhgalteriya-ssha-malogo-biznesa.html"
          )
          mapfile -t expected_sorted < <(printf '%s\n' "${expected[@]}" | sort)
          [[ "${changed[*]}" == "${expected_sorted[*]}" ]]

          git diff --cached --check
          git commit -m "Add premium hero image to flagship articles"
          git push origin "HEAD:${{ github.head_ref }}"
