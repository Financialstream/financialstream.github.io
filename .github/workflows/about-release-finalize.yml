name: Final About Release Gate

on:
  push:
    branches: [agent/about-trust-page-v1]

permissions:
  contents: write
  pull-requests: read

jobs:
  finalize-and-premerge:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/about-trust-page-v1
          fetch-depth: 0

      - name: Synchronize and apply release fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Financial Stream Release"
          git config user.email "actions@users.noreply.github.com"
          git fetch origin main
          git merge --no-edit origin/main
          git checkout origin/main -- assets/js/site.js
          rm -f assets/js/site-core.js

          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path('.')

          def clean_about(path: str):
              p = root / path
              s = p.read_text(encoding='utf-8')
              s = re.sub(r'<span class="about-note__disclaimer">.*?</span>', '', s, flags=re.S)
              s = re.sub(r'<small>\s*(?:Company principle|Принцип работы компании).*?</small>', '', s, flags=re.S)
              s = s.replace('Company principle. This space can later be replaced with Tetiana’s approved personal wording.', '')
              s = s.replace('Company principle. This is not presented as a personal quotation.', '')
              s = s.replace('Принцип работы компании. Текст не оформлен как личная цитата.', '')
              s = s.replace('Позже этот блок можно заменить', '')
              p.write_text(s, encoding='utf-8')

          clean_about('about/index.html')
          clean_about('ru/about/index.html')

          def patch_home(path: str, href: str, label: str, services: str, nav_title: str, service_label: str):
              p = root / path
              s = p.read_text(encoding='utf-8')
              about_anchor = f'<a href="{href}">{label}</a>'
              service_anchor = f'<a href="{services}">{service_label}</a>'
              if s.count(about_anchor) < 2:
                  s = s.replace(service_anchor, service_anchor + '\n      ' + about_anchor, 2)
              footer_marker = f'<h3 class="footer-title">{nav_title}</h3>\n        <ul class="footer-links">'
              footer_item = f'\n          <li><a href="{href}">{label}</a></li>'
              if s.count(about_anchor) < 3:
                  if footer_marker not in s:
                      raise SystemExit(f'Footer marker not found in {path}')
                  s = s.replace(footer_marker, footer_marker + footer_item, 1)
              p.write_text(s, encoding='utf-8')

          patch_home('index.html', '/about/', 'About', '/services/', 'Navigation', 'Services')
          patch_home('ru/index.html', '/ru/about/', 'О нас', '/ru/services/', 'Навигация', 'Услуги')

          css_path = root / 'assets/css/about.css'
          css = css_path.read_text(encoding='utf-8')
          marker = '/* FINAL_ABOUT_RELEASE_GATE */'
          if marker in css:
              css = css.split(marker, 1)[0].rstrip() + '\n'
          css += r'''
          /* FINAL_ABOUT_RELEASE_GATE */
          .about-page .site-header__inner > *,
          .about-page .site-header__panel > *,
          .about-page .about-hero__grid > *,
          .about-page .about-intro-grid > *,
          .about-page .about-note > *,
          .about-page .about-language-panel > *,
          .about-page .about-cta__card > *,
          .about-page .footer-grid > * { min-width: 0; }
          .about-page .about-note__body > div { min-width: 0; }
          .about-page .about-note__body p { overflow-wrap: normal; word-break: normal; }
          .about-page .footer-links a,
          .about-page .footer-note,
          .about-page .footer-bottom { overflow-wrap: anywhere; }
          .about-page .site-header.menu-open { transform: none !important; }
          .about-page .site-header__panel[hidden] { display: none !important; }
          .about-page .about-service-card:focus-visible { transform: none; }
          @media (max-width: 900px) {
            .about-page .about-owner-card { position: static; top: auto; }
            .about-page .site-header__inner > .header-actions { display: flex; }
            .about-page .site-header__inner > .header-actions .lang-switch { display: flex !important; }
            .about-page .site-header__panel .lang-switch { display: none !important; }
            .about-page .site-header__panel .header-actions > a:not(.btn) { display: none !important; }
          }
          @media (max-width: 430px) {
            .about-page .container { width: min(100% - 28px, 1180px); }
            .about-page .logo-image { width: min(154px, 44vw); }
            .about-page .about-hero__actions .btn,
            .about-page .about-cta__card .btn { width: 100%; white-space: normal; }
            .about-page .about-service-card { grid-template-columns: auto minmax(0, 1fr); }
            .about-page .about-service-card__arrow { display: none; }
          }
          @media (max-width: 900px) and (orientation: landscape) {
            .about-page .site-header__inner { min-height: 68px; }
            .about-page .about-hero { padding-top: 40px; }
            .about-page .about-portrait__frame { max-height: 72vh; }
          }
          @media (prefers-reduced-motion: reduce) {
            .about-page *, .about-page *::before, .about-page *::after {
              scroll-behavior: auto !important;
              animation-duration: .01ms !important;
              animation-iteration-count: 1 !important;
              transition-duration: .01ms !important;
            }
            body.js-enabled.about-page .fade-in { opacity: 1; transform: none; }
          }
          '''
          css_path.write_text(css, encoding='utf-8')
          PY

      - name: Static release gate
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet pillow beautifulsoup4
          python3 - <<'PY'
          from pathlib import Path
          from bs4 import BeautifulSoup
          from PIL import Image
          import json, re, subprocess

          root = Path('.')
          checks = [
              ('about/index.html', 'en', 'https://financialstreamllc.com/about/', '/ru/about/', 'Tetiana Horb'),
              ('ru/about/index.html', 'ru', 'https://financialstreamllc.com/ru/about/', '/about/', 'Татьяна Горб'),
          ]
          forbidden = re.compile(r'Owner\s*&\s*Practicing Accountant|Practicing Accountant|practicing accountant|\bCPA\b|\bEA\b|\blicensed\b|\bcertified\b|This space can later be replaced|not presented as a personal quotation|Позже этот блок можно заменить|Текст не оформлен как личная цитата', re.I)
          report = {'pages': {}, 'checks': []}
          for path, lang, canonical, other_href, person in checks:
              text = (root / path).read_text(encoding='utf-8')
              soup = BeautifulSoup(text, 'html.parser')
              assert soup.html.get('lang') == lang
              assert len(soup.find_all('h1')) == 1
              ids = [x['id'] for x in soup.find_all(id=True)]
              assert len(ids) == len(set(ids)), f'duplicate IDs in {path}'
              assert not forbidden.search(text), f'forbidden wording in {path}'
              assert 'CEO, Financial Stream LLC' in text
              assert person in text
              assert len(soup.select('.about-service-card')) == 6
              visible = soup.get_text(' ', strip=True)
              assert 'Payroll' in visible or 'Расчёт заработной платы' in visible
              assert ('Financial Consulting / Document Review' in visible or 'Финансовые консультации / Проверка документов' in visible)
              assert soup.find('link', rel='canonical')['href'] == canonical
              alts = {(x.get('hreflang'), x.get('href')) for x in soup.find_all('link', rel='alternate')}
              assert ('x-default', 'https://financialstreamllc.com/about/') in alts
              assert any(h == 'en' for h, _ in alts) and any(h == 'ru' for h, _ in alts)
              scripts = soup.find_all('script', attrs={'type':'application/ld+json'})
              assert scripts
              data = json.loads(scripts[0].string)
              assert data['@type'] == 'AboutPage'
              org = data['mainEntity']
              assert org['name'] == 'Financial Stream LLC'
              assert org['areaServed'] == 'US'
              assert org['employee']['jobTitle'] == 'CEO'
              assert org['employee']['name'] == person
              assert org['address']['addressLocality'] == 'Federal Way'
              assert org['availableLanguage'] == ['English', 'Russian']
              imgs = soup.find_all('img')
              assert imgs and all(i.get('alt') is not None for i in imgs)
              portrait = soup.select_one('.about-portrait img')
              assert portrait and portrait.get('width') == '1200' and portrait.get('height') == '1500'
              assert portrait.get('fetchpriority') == 'high'
              assert len(soup.select('.lang-switch')) == 1
              assert soup.select_one('.site-header__inner .lang-switch a')['href'] == other_href
              assert not soup.select('.site-header__panel .lang-switch')
              assert soup.select_one('[data-menu-toggle]')['aria-controls'] == soup.select_one('.site-header__panel')['id']
              assert soup.find('script', src=re.compile(r'assets/js/site\.js'))
              report['pages'][path] = {'h1': 1, 'services': 6, 'ids': len(ids), 'images': len(imgs)}

          assert (root/'index.html').read_text(encoding='utf-8').count('href="/about/">About</a>') == 3
          assert (root/'ru/index.html').read_text(encoding='utf-8').count('href="/ru/about/">О нас</a>') == 3
          assert not (root/'assets/js/site-core.js').exists()
          subprocess.run(['git','diff','--exit-code','origin/main','--','assets/js/site.js'], check=True)
          sitemap = (root/'sitemap.xml').read_text(encoding='utf-8')
          assert 'https://financialstreamllc.com/about/' in sitemap and 'https://financialstreamllc.com/ru/about/' in sitemap
          changed = subprocess.check_output(['git','diff','--name-only','origin/main'], text=True).splitlines()
          article_changes = [p for p in changed if re.search(r'(^|/)(blog|articles?)(/|$)', p)]
          assert not article_changes, article_changes
          photo = root/'assets/img/about/tetiana-financial-stream-ceo.webp'
          with Image.open(photo) as im:
              assert im.format == 'WEBP' and im.size == (1200,1500)
          report['photo'] = {'bytes': photo.stat().st_size, 'width': 1200, 'height': 1500, 'format': 'WEBP'}
          report['changed_files'] = changed
          Path('qa').mkdir(exist_ok=True)
          Path('qa/static-report.json').write_text(json.dumps(report, indent=2, ensure_ascii=False), encoding='utf-8')
          print(json.dumps(report, indent=2, ensure_ascii=False))
          PY

      - name: Commit final branch state
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/about-release-finalize.yml
          git add -A
          git commit -m "Finalize About trust release"
          git push origin HEAD:agent/about-trust-page-v1
          git rev-parse HEAD | tee qa/final-head.txt

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Browser QA and branch screenshots
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save playwright-core@1.55.0 >/dev/null 2>&1
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/about-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 2
          mkdir -p qa/premerge
          cat > /tmp/about-qa.mjs <<'JS'
          import { chromium } from 'playwright-core';
          import fs from 'node:fs';
          const root = process.env.BASE_URL || 'http://127.0.0.1:4173';
          const chrome = ['/usr/bin/google-chrome','/usr/bin/google-chrome-stable','/usr/bin/chromium'].find(fs.existsSync);
          if (!chrome) throw new Error('Chrome executable not found');
          const browser = await chromium.launch({headless:true, executablePath:chrome, args:['--no-sandbox']});
          const viewports = [
            ['desktop-1440',1440,1000],['desktop-1280',1280,900],['desktop-1024',1024,768],
            ['tablet-768',768,1024],['tablet-landscape-1024',1024,768],
            ['mobile-430',430,932],['mobile-390',390,844],['mobile-375',375,812],['mobile-360',360,800],['mobile-320',320,720],
            ['landscape-844',844,390],['landscape-932',932,430]
          ];
          const pages = [['en','/about/'],['ru','/ru/about/']];
          const failures=[]; const results=[];
          async function audit(lang,path,label,w,h){
            const page=await browser.newPage({viewport:{width:w,height:h}});
            const consoleErrors=[]; const pageErrors=[]; const failed=[];
            page.on('console',m=>{if(m.type()==='error') consoleErrors.push(m.text())});
            page.on('pageerror',e=>pageErrors.push(String(e)));
            page.on('requestfailed',r=>{if(new URL(r.url()).origin===new URL(root).origin) failed.push(r.url())});
            const response=await page.goto(root+path,{waitUntil:'networkidle'});
            if(!response || !response.ok()) failures.push(`${lang} ${label}: HTTP ${response?.status()}`);
            await page.waitForTimeout(250);
            const layout=await page.evaluate(()=>({
              sw:document.documentElement.scrollWidth, iw:window.innerWidth,
              h1:document.querySelectorAll('h1').length,
              visibleH1:!!document.querySelector('h1') && document.querySelector('h1').getBoundingClientRect().height>0,
              langSwitches:document.querySelectorAll('.lang-switch').length,
              services:document.querySelectorAll('.about-service-card').length,
              footer:!!document.querySelector('.footer')
            }));
            if(layout.sw>layout.iw+1) failures.push(`${lang} ${label}: overflow ${layout.sw}/${layout.iw}`);
            if(layout.h1!==1 || !layout.visibleH1 || layout.services!==6 || !layout.footer) failures.push(`${lang} ${label}: structural ${JSON.stringify(layout)}`);
            if(consoleErrors.length||pageErrors.length||failed.length) failures.push(`${lang} ${label}: runtime ${JSON.stringify({consoleErrors,pageErrors,failed})}`);
            if(w<=430){
              const toggle=page.locator('[data-menu-toggle]');
              await toggle.click(); await page.waitForTimeout(150);
              const open=await toggle.getAttribute('aria-expanded');
              const panelVisible=await page.locator('.site-header__panel').isVisible();
              if(open!=='true'||!panelVisible||layout.langSwitches!==1) failures.push(`${lang} ${label}: mobile menu/language switch`);
              await toggle.click();
              await page.evaluate(()=>scrollTo(0,document.body.scrollHeight*.45)); await page.waitForTimeout(350);
              await page.evaluate(()=>scrollBy(0,-260)); await page.waitForTimeout(350);
              const headerBox=await page.locator('.site-header').boundingBox();
              if(!headerBox || headerBox.y < -2) failures.push(`${lang} ${label}: header did not return`);
            }
            results.push({lang,label,w,h,...layout,consoleErrors,pageErrors,failed});
            await page.close();
          }
          for(const [lang,path] of pages) for(const [label,w,h] of viewports) await audit(lang,path,label,w,h);
          async function shot(lang,path,name,w,h,selector=null,menu=false){
            const page=await browser.newPage({viewport:{width:w,height:h}}); await page.goto(root+path,{waitUntil:'networkidle'}); await page.waitForTimeout(250);
            if(menu) await page.locator('[data-menu-toggle]').click();
            const target=selector?page.locator(selector):page;
            await target.screenshot({path:`qa/premerge/${name}.png`,fullPage:!selector}); await page.close();
          }
          await shot('en','/about/','01-en-about-desktop-1440',1440,1000);
          await shot('ru','/ru/about/','02-ru-about-desktop-1440',1440,1000);
          await shot('en','/about/','03-en-about-mobile-390',390,844);
          await shot('ru','/ru/about/','04-ru-about-mobile-390',390,844);
          await shot('ru','/ru/about/','05-ru-about-mobile-320',320,720);
          await shot('en','/about/','06-en-about-landscape-844',844,390);
          await shot('en','/about/','07-mobile-header',390,844,'.site-header');
          await shot('en','/about/','08-open-mobile-menu',390,844,'.site-header',true);
          await shot('en','/about/','09-owner-ceo-note',1280,900,'.about-intro-grid');
          await shot('en','/about/','10-six-services',1280,900,'.about-services-grid');
          await shot('ru','/ru/about/','11-mobile-footer',390,844,'.footer');
          for(const [lang,path] of [['en','/'],['ru','/ru/']]){
            const page=await browser.newPage({viewport:{width:390,height:844}}); await page.goto(root+path,{waitUntil:'networkidle'});
            const count=await page.locator(lang==='en'?'a[href="/about/"]':'a[href="/ru/about/"]').count();
            const overflow=await page.evaluate(()=>document.documentElement.scrollWidth>innerWidth+1);
            if(count!==3||overflow) failures.push(`${lang} homepage smoke: count=${count} overflow=${overflow}`);
            await page.locator('[data-menu-toggle]').click(); if(await page.locator('[data-menu-toggle]').getAttribute('aria-expanded')!=='true') failures.push(`${lang} homepage menu`);
            await page.close();
          }
          fs.writeFileSync('qa/premerge/browser-report.json',JSON.stringify({root,results,failures},null,2));
          await browser.close();
          if(failures.length){console.error(failures.join('\n'));process.exit(1)}
          JS
          node /tmp/about-qa.mjs

      - uses: actions/upload-artifact@v4
        with:
          name: about-premerge-qa
          path: qa/
          if-no-files-found: error
          retention-days: 30

  post-deployment-live-qa:
    needs: finalize-and-premerge
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Wait for PR merge
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for i in $(seq 1 150); do
            merged=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" https://api.github.com/repos/Financialstream/financialstream.github.io/pulls/9 | jq -r .merged)
            if [ "$merged" = "true" ]; then exit 0; fi
            sleep 10
          done
          echo "PR #9 was not merged within the live-QA window" >&2
          exit 1

      - name: Wait for live deployment
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 120); do
            en=$(curl -fsSL https://financialstreamllc.com/about/ || true)
            ru=$(curl -fsSL https://financialstreamllc.com/ru/about/ || true)
            if grep -q 'A note from the CEO' <<<"$en" && grep -q 'Слово руководителя' <<<"$ru" && ! grep -q 'This space can later be replaced' <<<"$en"; then
              exit 0
            fi
            sleep 10
          done
          echo "Live About routes did not reach the merged release" >&2
          exit 1

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Live browser QA and screenshots
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save playwright-core@1.55.0 >/dev/null 2>&1
          mkdir -p live-qa
          cat > /tmp/live-qa.mjs <<'JS'
          import { chromium } from 'playwright-core';
          import fs from 'node:fs';
          const base='https://financialstreamllc.com';
          const chrome=['/usr/bin/google-chrome','/usr/bin/google-chrome-stable','/usr/bin/chromium'].find(fs.existsSync);
          const browser=await chromium.launch({headless:true,executablePath:chrome,args:['--no-sandbox']});
          const failures=[]; const results=[];
          const viewports=[['desktop-1440',1440,1000],['desktop-1280',1280,900],['desktop-1024',1024,768],['tablet-768',768,1024],['mobile-430',430,932],['mobile-390',390,844],['mobile-375',375,812],['mobile-360',360,800],['mobile-320',320,720],['landscape-844',844,390],['landscape-932',932,430]];
          for(const [lang,path] of [['en','/about/'],['ru','/ru/about/']]) for(const [label,w,h] of viewports){
            const page=await browser.newPage({viewport:{width:w,height:h}}); const errors=[]; const failed=[];
            page.on('pageerror',e=>errors.push(String(e))); page.on('console',m=>{if(m.type()==='error') errors.push(m.text())});
            page.on('requestfailed',r=>{if(new URL(r.url()).origin===base) failed.push(r.url())});
            const res=await page.goto(base+path,{waitUntil:'networkidle',timeout:60000});
            const x=await page.evaluate(()=>({sw:document.documentElement.scrollWidth,iw:innerWidth,h1:document.querySelectorAll('h1').length,services:document.querySelectorAll('.about-service-card').length,lang:document.querySelectorAll('.lang-switch').length}));
            if(!res?.ok()||x.sw>x.iw+1||x.h1!==1||x.services!==6||x.lang!==1||errors.length||failed.length) failures.push({lang,label,status:res?.status(),x,errors,failed});
            if(w<=430){await page.locator('[data-menu-toggle]').click(); if(await page.locator('[data-menu-toggle]').getAttribute('aria-expanded')!=='true') failures.push({lang,label,menu:false});}
            results.push({lang,label,status:res?.status(),...x,errors,failed}); await page.close();
          }
          async function shot(path,name,w,h,selector=null,menu=false){const p=await browser.newPage({viewport:{width:w,height:h}});await p.goto(base+path,{waitUntil:'networkidle'});if(menu)await p.locator('[data-menu-toggle]').click();const t=selector?p.locator(selector):p;await t.screenshot({path:`live-qa/${name}.png`,fullPage:!selector});await p.close();}
          await shot('/about/','01-live-en-desktop-1440',1440,1000); await shot('/ru/about/','02-live-ru-desktop-1440',1440,1000);
          await shot('/about/','03-live-en-mobile-390',390,844); await shot('/ru/about/','04-live-ru-mobile-390',390,844); await shot('/ru/about/','05-live-ru-mobile-320',320,720);
          await shot('/about/','06-live-landscape-844',844,390); await shot('/about/','07-live-mobile-header',390,844,'.site-header'); await shot('/about/','08-live-open-menu',390,844,'.site-header',true);
          await shot('/about/','09-live-owner',1280,900,'.about-intro-grid'); await shot('/about/','10-live-services',1280,900,'.about-services-grid'); await shot('/ru/about/','11-live-mobile-footer',390,844,'.footer');
          for(const [lang,path,href] of [['en','/','/about/'],['ru','/ru/','/ru/about/']]){const p=await browser.newPage({viewport:{width:390,height:844}});const r=await p.goto(base+path,{waitUntil:'networkidle'});const count=await p.locator(`a[href="${href}"]`).count();const overflow=await p.evaluate(()=>document.documentElement.scrollWidth>innerWidth+1);if(!r?.ok()||count!==3||overflow)failures.push({lang,homepage:true,status:r?.status(),count,overflow});await p.close();}
          fs.writeFileSync('live-qa/live-browser-report.json',JSON.stringify({base,results,failures,checkedAt:new Date().toISOString()},null,2)); await browser.close(); if(failures.length){console.error(JSON.stringify(failures,null,2));process.exit(1)}
          JS
          node /tmp/live-qa.mjs

      - uses: actions/upload-artifact@v4
        with:
          name: about-live-qa
          path: live-qa/
          if-no-files-found: error
          retention-days: 30