name: Final minor maintenance patch

on:
  push:
    branches:
      - agent/final-financial-stream-minor-maintenance

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply exact maintenance patch and source QA
        shell: python
        run: |
          from pathlib import Path
          import re

          expected_menu_files = {
              'ru/index.html',
              'ru/blog/index.html',
              'ru/blog/buhgalteriya-ssha-malogo-biznesa.html',
              'ru/contact/index.html',
              'ru/start-here/index.html',
              'ru/services/tax-returns.html',
              'ru/services/company-formation.html',
              'ru/services/payroll-li-quarterly.html',
              'ru/services/financial-consulting.html',
              'ru/services/quickbooks-bookkeeping.html',
              'ru/services/sales-tax-dor-reporting.html',
          }

          changed_menu_files = set()
          menu_tag = re.compile(r'<button\b[^>]*\bdata-menu-toggle\b[^>]*>')

          for path in sorted(Path('ru').rglob('*.html')):
              raw = path.read_bytes()
              text = raw.decode('utf-8')
              original = text
              tags = list(menu_tag.finditer(text))
              if not tags:
                  continue

              out = []
              cursor = 0
              changed = False
              for match in tags:
                  tag = match.group(0)
                  replacement = tag
                  if 'aria-label=' not in tag:
                      if ' data-menu-toggle' not in tag:
                          raise SystemExit(f'Unexpected menu toggle markup in {path}: {tag}')
                      replacement = tag.replace(
                          ' data-menu-toggle',
                          ' aria-label="Открыть меню" data-menu-toggle',
                          1,
                      )
                      changed = True
                  out.append(text[cursor:match.start()])
                  out.append(replacement)
                  cursor = match.end()
              out.append(text[cursor:])
              text = ''.join(out)

              if changed:
                  changed_menu_files.add(path.as_posix())
                  path.write_bytes(text.encode('utf-8'))

          if changed_menu_files != expected_menu_files:
              raise SystemExit(
                  'Unexpected RU menu patch set. '
                  f'Expected {sorted(expected_menu_files)}, got {sorted(changed_menu_files)}'
              )

          metadata = {
              'blog/us-bookkeeping-small-business.html': (
                  '<meta name="twitter:image" content="https://financialstreamllc.com/assets/img/og/financial-stream-og-en-1200x630.png">',
                  '<meta name="twitter:image:alt" content="Financial Stream LLC — reliable small-business bookkeeping">',
              ),
              'ru/blog/buhgalteriya-ssha-malogo-biznesa.html': (
                  '<meta name="twitter:image" content="https://financialstreamllc.com/assets/img/og/financial-stream-og-ru-1200x630.png">',
                  '<meta name="twitter:image:alt" content="Financial Stream LLC — надёжный учёт малого бизнеса">',
              ),
          }

          for file_name, (twitter_image, twitter_alt) in metadata.items():
              path = Path(file_name)
              text = path.read_bytes().decode('utf-8')
              if text.count(twitter_alt) == 0:
                  if text.count(twitter_image) != 1:
                      raise SystemExit(f'Expected exactly one twitter:image in {file_name}')
                  newline = '\r\n' if '\r\n' in text else '\n'
                  text = text.replace(twitter_image, twitter_image + newline + twitter_alt, 1)
                  path.write_bytes(text.encode('utf-8'))
              if path.read_bytes().decode('utf-8').count(twitter_alt) != 1:
                  raise SystemExit(f'Expected exactly one twitter:image:alt in {file_name}')

          # Accessibility source QA across every RU HTML page using the mobile toggle.
          for path in sorted(Path('ru').rglob('*.html')):
              text = path.read_bytes().decode('utf-8')
              for match in menu_tag.finditer(text):
                  tag = match.group(0)
                  if 'aria-label="Открыть меню"' not in tag:
                      raise SystemExit(f'Missing canonical aria-label in {path}: {tag}')
                  if 'aria-expanded="false"' not in tag:
                      raise SystemExit(f'aria-expanded damaged in {path}: {tag}')
                  controls = re.search(r'aria-controls="([^"]+)"', tag)
                  if not controls:
                      raise SystemExit(f'aria-controls missing in {path}: {tag}')
                  if f'id="{controls.group(1)}"' not in text:
                      raise SystemExit(f'aria-controls target missing in {path}: {controls.group(1)}')

          # Flagship metadata QA: preserve canonical/hreflang/OG/Twitter image and schema blocks.
          checks = {
              'blog/us-bookkeeping-small-business.html': [
                  '<link rel="canonical" href="https://financialstreamllc.com/blog/us-bookkeeping-small-business.html">',
                  '<link rel="alternate" hreflang="ru" href="https://financialstreamllc.com/ru/blog/buhgalteriya-ssha-malogo-biznesa.html">',
                  '<meta property="og:image" content="https://financialstreamllc.com/assets/img/og/financial-stream-og-en-1200x630.png">',
                  '<meta name="twitter:image" content="https://financialstreamllc.com/assets/img/og/financial-stream-og-en-1200x630.png">',
                  '"@type":"Article"',
                  '"@type":"BreadcrumbList"',
                  '"@type":"FAQPage"',
              ],
              'ru/blog/buhgalteriya-ssha-malogo-biznesa.html': [
                  '<link rel="canonical" href="https://financialstreamllc.com/ru/blog/buhgalteriya-ssha-malogo-biznesa.html">',
                  '<link rel="alternate" hreflang="en" href="https://financialstreamllc.com/blog/us-bookkeeping-small-business.html">',
                  '<meta property="og:image" content="https://financialstreamllc.com/assets/img/og/financial-stream-og-ru-1200x630.png">',
                  '<meta name="twitter:image" content="https://financialstreamllc.com/assets/img/og/financial-stream-og-ru-1200x630.png">',
                  '"@type":"Article"',
                  '"@type":"BreadcrumbList"',
                  '"@type":"FAQPage"',
              ],
          }
          for file_name, required in checks.items():
              text = Path(file_name).read_bytes().decode('utf-8')
              for item in required:
                  if text.count(item) != 1:
                      raise SystemExit(f'Flagship QA failed in {file_name}: {item}')
              if text.count('<meta name="twitter:image:alt"') != 1:
                  raise SystemExit(f'Expected exactly one twitter:image:alt in {file_name}')

          allowed = expected_menu_files | {'blog/us-bookkeeping-small-business.html'}
          import subprocess
          changed = set(subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines())
          if changed != allowed:
              raise SystemExit(f'Unexpected changed files: {sorted(changed)}; expected {sorted(allowed)}')

          print('Source QA passed. Changed files:')
          for item in sorted(changed):
              print(item)

      - name: Commit exact HTML changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            ru/index.html \
            ru/blog/index.html \
            ru/blog/buhgalteriya-ssha-malogo-biznesa.html \
            ru/contact/index.html \
            ru/start-here/index.html \
            ru/services/tax-returns.html \
            ru/services/company-formation.html \
            ru/services/payroll-li-quarterly.html \
            ru/services/financial-consulting.html \
            ru/services/quickbooks-bookkeeping.html \
            ru/services/sales-tax-dor-reporting.html \
            blog/us-bookkeeping-small-business.html
          git diff --cached --check
          git commit -m "Fix minor accessibility and Twitter image metadata"
          git push origin HEAD:agent/final-financial-stream-minor-maintenance
