name: Repair canonical Tetiana portrait

on:
  push:
    branches:
      - agent/fix-tetiana-portrait-v2

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/fix-tetiana-portrait-v2

      - name: Restore the last known-good approved portrait
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/img/team
          git show d72874a6bb14e2bb63256a0fa88f6e0b35399a28:assets/img/team/tetiana-horb-ceo.webp > assets/img/team/tetiana-horb-ceo-approved.webp
          test "$(stat -c%s assets/img/team/tetiana-horb-ceo-approved.webp)" = "46188"
          echo "a4bd2076b9f23387da73713abab95ec504cc566df2de4579927324521e39852b  assets/img/team/tetiana-horb-ceo-approved.webp" | sha256sum -c -
          file assets/img/team/tetiana-horb-ceo-approved.webp | grep -q 'Web/P image'

      - name: Update all active EN and RU references
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          canonical = "/assets/img/team/tetiana-horb-ceo-approved.webp"

          about_files = [Path("about/index.html"), Path("ru/about/index.html")]
          article_files = [
              Path("blog/us-bookkeeping-small-business.html"),
              Path("ru/blog/buhgalteriya-ssha-malogo-biznesa.html"),
          ]

          for path in about_files:
              text = path.read_text(encoding="utf-8")
              text = text.replace("https://financialstreamllc.com/assets/img/about/tetiana-financial-stream-ceo.webp", f"https://financialstreamllc.com{canonical}")
              text = text.replace("../assets/img/about/tetiana-financial-stream-ceo.webp", canonical)
              text = text.replace("../../assets/img/about/tetiana-financial-stream-ceo.webp", canonical)
              text = text.replace('<meta property="og:image:width" content="1200">', '<meta property="og:image:width" content="960">')
              text = text.replace('<meta property="og:image:height" content="1500">', '<meta property="og:image:height" content="1200">')
              text = text.replace('width="1200" height="1500"', 'width="960" height="1200"')
              path.write_text(text, encoding="utf-8")

          for path in article_files:
              text = path.read_text(encoding="utf-8")
              text = text.replace("/assets/img/team/tetiana-horb-ceo.webp", canonical)
              text = text.replace("/assets/img/team/tetiana-horb-ceo-960x1200.jpg", canonical)
              path.write_text(text, encoding="utf-8")
          PY

      - name: Remove superseded and damaged portrait files
        shell: bash
        run: |
          set -euo pipefail
          rm -f assets/img/about/tetiana-financial-stream-ceo.webp
          rm -f assets/img/team/tetiana-horb-ceo.webp
          rm -f assets/img/team/tetiana-horb-ceo-960x1200.jpg

      - name: Verify one canonical image and no stale references
        shell: bash
        run: |
          set -euo pipefail
          test -f assets/img/team/tetiana-horb-ceo-approved.webp
          test ! -e assets/img/about/tetiana-financial-stream-ceo.webp
          test ! -e assets/img/team/tetiana-horb-ceo.webp
          test ! -e assets/img/team/tetiana-horb-ceo-960x1200.jpg
          ! grep -R --exclude-dir=.git -nE 'tetiana-financial-stream-ceo\.webp|tetiana-horb-ceo\.webp|tetiana-horb-ceo-960x1200\.jpg' about ru/about blog/us-bookkeeping-small-business.html ru/blog/buhgalteriya-ssha-malogo-biznesa.html assets || false
          count=$(grep -R --exclude-dir=.git -o 'tetiana-horb-ceo-approved.webp' about/index.html ru/about/index.html blog/us-bookkeeping-small-business.html ru/blog/buhgalteriya-ssha-malogo-biznesa.html | wc -l)
          test "$count" -ge 10
          python3 - <<'PY'
          from pathlib import Path
          old = [
              "tetiana-financial-stream-ceo.webp",
              "tetiana-horb-ceo.webp",
              "tetiana-horb-ceo-960x1200.jpg",
          ]
          files = [
              Path("about/index.html"),
              Path("ru/about/index.html"),
              Path("blog/us-bookkeeping-small-business.html"),
              Path("ru/blog/buhgalteriya-ssha-malogo-biznesa.html"),
          ]
          for path in files:
              text = path.read_text(encoding="utf-8")
              for token in old:
                  if token in text:
                      raise SystemExit(f"stale reference {token} in {path}")
              if "tetiana-horb-ceo-approved.webp" not in text:
                  raise SystemExit(f"canonical portrait missing from {path}")
          PY

      - name: Remove temporary workflow and trigger
        shell: bash
        run: |
          rm -f .github/workflows/repair-tetiana-portrait.yml
          rm -f .github/repair-tetiana-trigger.txt

      - name: Commit clean production repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Repair canonical Tetiana portrait across EN and RU"
          git push origin HEAD:agent/fix-tetiana-portrait-v2
